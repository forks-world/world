name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WORLD_FUZZ_BUDGET: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Allow unprivileged user namespaces (Ubuntu AppArmor)
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install pasta for workspace networking
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y passt
      - name: No process::exit in world-fsmodel tests
        # process::exit in a test thread kills the whole harness and hides
        # every other result; delegate to a child process instead.
        run: "! grep -rn 'process::exit' crates/world-fsmodel/tests"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked && cargo build --workspace --examples --locked
      - run: python3 -m unittest discover -s tests -v
      - name: Native silo same-port acceptance (real macOS aliases)
        if: runner.os == 'macOS'
        env:
          WORLD_SILO_INTEGRATION: "1"
        run: python3 -m unittest discover -s tests -v
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failures-${{ matrix.os }}
          path: |
            target/fuzz-artifacts
            **/proptest-regressions
          if-no-files-found: ignore
          retention-days: 14
