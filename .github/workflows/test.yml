name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked && cargo build --workspace --examples --locked
      - run: python3 -m unittest discover -s tests -v
      - name: Native silo same-port acceptance (real macOS aliases)
        if: runner.os == 'macOS'
        env:
          WORLD_SILO_INTEGRATION: "1"
        run: python3 -m unittest discover -s tests -v
